# yt-transcript Configuration Template
# Copy this file to config.yaml and fill in your settings
# This config surface is intentionally limited to flat top-level key/value pairs.
# Nested YAML and multi-line values are not supported.

# Deepgram API Key (get from https://console.deepgram.com/)
# Required only when a video has no usable subtitles and audio transcription is needed.
deepgram_api_key: "your_deepgram_api_key_here"
# Optional advanced Deepgram model override. The default path is Nova 3.
# Legacy nova-2 variants are automatically upgraded to nova-3 at runtime.
deepgram_model: "nova-3"
# Structured transcript assembly now defaults on.
# Set either flag to false only when debugging parity with the legacy flat path.
deepgram_enable_utterances: true
deepgram_prefer_structured_output: true

# Output directory for transcribed files. This is the only always-required field.
output_dir: "~/Downloads"

# yt-dlp tuning (optional)
# These default to conservative bounded values to avoid long hangs.
# Invalid, empty, or negative values automatically fall back to these defaults.
yt_dlp_socket_timeout_sec: 15
yt_dlp_retries: 1
yt_dlp_extractor_retries: 1

# YouTube anti-bot / login handling (optional)
# Default behavior: yt-transcript does NOT read browser cookies up front.
# If yt-dlp hits "Sign in to confirm you're not a bot", download.sh will
# automatically retry (up to 3 attempts) with: --cookies-from-browser chrome
#
# Leave these blank unless you want to force a specific auth source.
# This is useful when:
# - Chrome is not installed in the current environment
# - Chrome is installed but not logged into YouTube
# - You are running remotely / inside a container
#
# Option A: force a browser profile explicitly
#   yt_dlp_cookies_from_browser: "chrome"
#   # Examples: "chrome", "edge", "firefox", "safari" (depends on yt-dlp support)
#
# Option B: use an exported Netscape-format cookies.txt (most portable)
#   yt_dlp_cookies_file: "~/Downloads/youtube_cookies.txt"
yt_dlp_cookies_from_browser: ""
yt_dlp_cookies_file: ""

# Chunk LLM backend for long videos: auto | api
# auto: send chunks to the calling agent's own CLI (Claude Code `claude -p`,
#       Codex `codex exec`, OpenCode, pi, Gemini CLI, Cursor), detected from the
#       environment or passed with `process-chunks --agent-cli`. The CLI must
#       answer a short probe first; if it can't, or fails mid-run, the API
#       below is used instead.
# api:  always use the API below.
llm_backend: "auto"
# Optional fixed agent for auto mode: a name above or a full non-interactive
# command (use {prompt} where the prompt goes; otherwise it is sent on stdin).
llm_agent_cli: ""
llm_cli_timeout_sec: 600
llm_cli_max_retries: 1
llm_cli_probe_timeout_sec: 120

# LLM API Configuration
# Fallback for llm_backend=auto, and the only backend for llm_backend=api.
# Format: "openai" (OpenAI-compatible) or "anthropic" (Anthropic Messages API)
llm_api_format: "openai"
llm_api_key: "your_llm_api_key_here"
# Can be either provider root URL or a /v1 URL; the tool normalizes both.
llm_base_url: "https://api.deepseek.com"
llm_model: "deepseek-v4-pro"
# Request hardening for chunk processing
llm_timeout_sec: 180
llm_max_retries: 3
llm_backoff_sec: 1.5
# Streaming mode: auto | true | false
llm_stream: "auto"
# Small probe used by preflight.sh --require-llm
llm_probe_timeout_sec: 20
llm_probe_max_tokens: 16
# In auto streaming mode, process-chunks sends one non-streaming "OK" probe for
# unknown OpenAI-compatible models. If the response exposes reasoning metadata,
# later chunk calls run non-streaming so usage/reasoning tokens remain visible.
llm_reasoning_probe_enabled: true
# Stop batch if provider times out repeatedly
llm_stop_after_consecutive_timeouts: 2
# Re-run suspiciously short / malformed chunk outputs before surfacing warnings
llm_chunk_recovery_attempts: 1
llm_chunk_recovery_backoff_sec: 1.0
# When a chunk response stops at max_tokens (finish_reason length / max_tokens /
# max_output_tokens, from any provider), process-chunks retries it with a larger
# ceiling: at least multiplier x the old one, and at least old + the reasoning
# tokens the model reported, up to llm_output_retry_max_tokens. If the provider
# rejects the larger value, the run keeps the last accepted one. A chunk still
# cut off after that is flagged truncated_output instead of being accepted.
# (Formerly llm_reasoning_retry_*; the old names still work but print a warning.)
llm_output_retry_attempts: 2
llm_output_retry_multiplier: 2.0
llm_output_retry_max_tokens: 16384

# Long-text executor: window | chunks
# window (default): sliding window for cleanup_zh, quick_cleanup and the
#         bilingual pair structure_only -> translate_only. Source units are
#         numbered; each request reads from a cursor, aims to write about N
#         tokens, and copies each unit's [S<n>] tag in front of its text,
#         ending with <!--END-->. The program works out where each paragraph
#         ends; without the end line the last paragraph is dropped, so a
#         cut-off response just advances less. Sizes adapt per round: N starts at window_write_tokens (and
#         never exceeds it), the read window is N divided by the measured
#         output/source ratio plus 25% look-ahead, capped at window_read_tokens,
#         and the last stretch is sent whole when one round can finish it.
# chunks: legacy fixed chunks planned up front, one request per chunk. Other
#         prompts (summarize) always use it, and so does a work dir that
#         already finished chunks in this mode, so its done chunks are kept.
long_text_mode: "window"
window_read_tokens: 6000
window_write_tokens: 3000
# Tail of the already-written output sent as left context each round.
window_tail_tokens: 400
# Retries of a response without usable tags (or with far too little or too
# much output for the source it claims) before that stretch is processed once
# with the plain fixed-chunk prompt.
window_marker_retries: 1
# Global outline (window mode, cleanup_zh and structure_only): before the
# first round the whole numbered source goes to the model once and comes back
# as a short JSON outline (section titles + first unit) and a list of names and
# terms with their correct spellings. Rounds get the nearby outline lines and
# the terms found in their window; section headings come only from the outline
# (written by the model where the topic really starts, else placed by the
# program). YouTube chapters (from chunk-document --chapters or
# chapter_plan.json) are given as hints. If the outline fails, rounds place
# their own headings as before. The source is outlined in parts when it is
# longer than window_outline_read_tokens; raise it for long-context models.
window_outline: true
window_outline_read_tokens: 16000
window_outline_max_terms: 40

# Chunk planning (chunk-text / chunk-segments / chunk-document). The window
# executor reads its source from these chunk files and renumbers it, so chunk
# size matters only to the fixed-chunk executor.
# Default mode is token-aware. Set to "chars" for legacy character chunking.
chunk_mode: "tokens"
# Override the per-task chunk target in the active mode. 0 disables override.
chunk_size_override: 0
chunk_tokens_structure_only: 1200
chunk_tokens_quick_cleanup: 1000
chunk_tokens_cleanup_zh: 1000
chunk_tokens_translate_only: 900
chunk_tokens_summarize: 2500
# Soft target * multiplier for forced split guardrail. Valid range: 1.0-2.0.
chunk_hard_cap_multiplier: 1.33
# Most transcript glossary terms put into one request's prompt.
chunk_glossary_max_prompt_terms: 8
# Expected output/source token ratio per task. Fixed chunks use it for
# sizing; the window uses it as the starting ratio for its read window and
# for rejecting rounds whose output is far too short or long.
output_ratio_structure_only: 1.15
output_ratio_quick_cleanup: 1.05
output_ratio_cleanup_zh: 1.05
output_ratio_translate_only: 1.10
output_ratio_summarize: 0.15
# max_tokens ceiling per request (chunk or window round). It is a stop line,
# not a budget: chunk size or the window write target decides how much a
# request writes, and an unused ceiling costs nothing. Set a smaller value
# only if your model rejects 8192.
max_output_tokens_structure_only: 8192
max_output_tokens_quick_cleanup: 8192
max_output_tokens_cleanup_zh: 8192
max_output_tokens_translate_only: 8192
max_output_tokens_summarize: 8192
enable_token_count_probe: true
